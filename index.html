<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Web Flasher & OTA</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --border-color: #e5e5ea;
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--card-bg);
            width: 420px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-top: 0;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Segmented Control kiểu iOS cho phần chọn nguồn file */
        .ios-segment {
            display: flex;
            background: #e3e3e8;
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .ios-segment label {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .ios-segment input {
            display: none;
        }

        .ios-segment input:checked + span {
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            font-weight: 600;
        }

        .ios-segment span {
            display: block;
            width: 100%;
            height: 100%;
            line-height: 28px;
            border-radius: 8px;
        }

        /* Khung thông tin file */
        .info-container {
            background: #fafafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* File input tuỳ chỉnh ẩn */
        input[type="file"] {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
            width: 100%;
        }

        /* Nút bấm phong cách iOS */
        .ios-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .ios-btn:active {
            transform: scale(0.97);
        }

        .btn-blue {
            background-color: var(--accent-blue);
            color: white;
        }

        .btn-green {
            background-color: var(--accent-green);
            color: white;
        }

        .ios-btn:disabled {
            background-color: #e5e5ea;
            color: #aeaeb2;
            cursor: not-allowed;
            transform: none;
        }

        /* Thanh tiến trình kiểu iOS */
        .progress-container {
            background-color: #e5e5ea;
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin: 16px 0;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-blue);
            width: 0%;
            transition: width 0.2s ease;
            border-radius: 6px;
        }

        /* Hộp log trạng thái tối giản */
        .terminal-box {
            background: #1c1c1e;
            color: #30d158;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            padding: 12px;
            border-radius: 12px;
            height: 140px;
            overflow-y: auto;
            line-height: 1.5;
            margin-top: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>ESP32 Flasher</h2>
        <p class="subtitle">Cập nhật và nạp firmware trực tiếp</p>
        
        <!-- Bộ chọn nguồn file kiểu Segmented Control -->
        <div class="ios-segment">
            <label>
                <input type="radio" name="sourceMode" value="server" checked>
                <span>Server (merged.bin)</span>
            </label>
            <label>
                <input type="radio" name="sourceMode" value="local">
                <span>Chọn từ máy</span>
            </label>
        </div>

        <!-- Khung hiển thị thông tin -->
        <div class="info-container">
            <div id="serverFileInfo">
                <div class="info-row"><span class="info-label">Nguồn:</span> <span class="info-value">Render Cloud</span></div>
                <div class="info-row"><span class="info-label">Trạng thái:</span> <span class="info-value" id="serverStatusText">Đang tải...</span></div>
            </div>
            <div id="localFileInfo" style="display: none;">
                <div class="info-row"><span class="info-label">Tệp tin:</span></div>
                <input type="file" id="localFilePicker" accept=".bin">
            </div>
        </div>

        <button id="connectBtn" class="ios-btn btn-blue">🔌 Kết nối USB</button>
        <button id="flashBtn" class="ios-btn btn-green" disabled>🚀 Bắt đầu Nạp</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="log" class="terminal-box">Sẵn sàng thiết lập...</div>
    </div>

    <script type="module">
        import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.5.2/bundle.js";

        let port;
        let activeFirmwareBlob = null;
        let activeFileName = "";
        let flashAddress = 0x0; // Mặc định từ server là merged-binary nạp từ 0x0
        
        const modeRadios = document.getElementsByName('sourceMode');
        const serverFileInfo = document.getElementById('serverFileInfo');
        const localFileInfo = document.getElementById('localFileInfo');
        const serverStatusText = document.getElementById('serverStatusText');
        const localFilePicker = document.getElementById('localFilePicker');
        
        const connectBtn = document.getElementById('connectBtn');
        const flashBtn = document.getElementById('flashBtn');
        const logEl = document.getElementById('log');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        function log(text) {
            logEl.innerText += "\n" + text;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function loadServerFirmware() {
            try {
                serverStatusText.innerText = "Đang kết nối...";
                const response = await fetch('/download-firmware');
                if (!response.ok) throw new Error("Không thấy file trên server!");
                
                activeFirmwareBlob = await response.blob();
                activeFileName = "merged-binary.bin";
                flashAddress = 0x0; // File gộp nạp từ 0x0
                
                const bytes = activeFirmwareBlob.size;
                const sizeStr = bytes < 1024 * 1024 ? (bytes / 1024).toFixed(1) + " KB" : (bytes / (1024 * 1024)).toFixed(2) + " MB";

                serverStatusText.innerText = `${activeFileName} (${sizeStr})`;
                log("✓ Đã tải file từ server thành công (Nạp từ địa chỉ 0x0).");
                checkReadyToFlash();
            } catch (e) {
                serverStatusText.innerText = "Lỗi kết nối server";
                log("Lỗi: " + e.message);
            }
        }

        modeRadios.forEach(radio => {
            radio.onchange = (e) => {
                if (e.target.value === 'server') {
                    serverFileInfo.style.display = 'block';
                    localFileInfo.style.display = 'none';
                    loadServerFirmware();
                } else {
                    serverFileInfo.style.display = 'none';
                    localFileInfo.style.display = 'block';
                    flashAddress = 0x10000; // File local (xiaozhi.bin) nạp từ 0x10000
                    if (localFilePicker.files.length > 0) {
                        activeFirmwareBlob = localFilePicker.files[0];
                        activeFileName = activeFirmwareBlob.name;
                    } else {
                        activeFirmwareBlob = null;
                    }
                    checkReadyToFlash();
                }
            };
        });

        localFilePicker.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                activeFirmwareBlob = file;
                activeFileName = file.name;
                flashAddress = 0x10000; // File app chọn thủ công thường là xiaozhi.bin
                log(`✓ Đã chọn tệp: ${file.name} (Nạp từ địa chỉ 0x10000)`);
                checkReadyToFlash();
            }
        };

        function checkReadyToFlash() {
            if (port && activeFirmwareBlob) {
                flashBtn.disabled = false;
            } else {
                flashBtn.disabled = true;
            }
        }

        loadServerFirmware();

        const ESP_VEN_IDS = [0x10C4, 0x1A86, 0x303A];

        connectBtn.onclick = async () => {
            try {
                const filters = ESP_VEN_IDS.map(usbVendorId => ({ usbVendorId }));
                port = await navigator.serial.requestPort({ filters });
                
                log("✓ Đã kết nối cổng Serial USB!");
                connectBtn.innerText = "Đã kết nối USB ✓";
                connectBtn.style.backgroundColor = "#8e8e93";
                
                checkReadyToFlash();
            } catch (e) {
                log("⚠️ Chưa chọn thiết bị.");
            }
        };

        flashBtn.onclick = async () => {
            if (!port || !activeFirmwareBlob) return;

            flashBtn.disabled = true;
            connectBtn.disabled = true;
            progressContainer.style.display = "block";
            progressBar.style.width = "0%";
            log(`⚡ Đang nạp ${activeFileName} tại địa chỉ 0x${flashAddress.toString(16)}...`);

            try {
                const transport = new Transport(port);
                const esploader = new ESPLoader({
                    transport,
                    baudrate: 921600,
                    terminal: {
                        clean() {},
                        writeLine: data => log(data),
                        write: data => log(data)
                    }
                });

                log("Đang giao tiếp phần cứng ESP32...");
                await esploader.main();
                log("Xác thực chip thành công.");

                const arrayBuffer = await activeFirmwareBlob.arrayBuffer();
                const fileArray = [{ data: new Uint8Array(arrayBuffer), address: flashAddress }];

                log("Đang ghi dữ liệu Flash...");
                await esploader.writeFlash({
                    fileArray: fileArray,
                    flashSize: "keep",
                    eraseAll: false,
                    compress: true,
                    reportProgress: (fileIdx, written, total) => {
                        const percent = Math.round((written / total) * 100);
                        progressBar.style.width = percent + "%";
                    }
                });

                log("🎉 Nạp thành công! Đang khởi động lại...");
                await esploader.hardReset();
                log("✨ Hoàn tất.");

            } catch (e) {
                log("❌ Lỗi: " + e.message);
                flashBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
